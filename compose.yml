services:
  accessibility-manager:
    build:
      context: .
      dockerfile: Containerfile
    container_name: accessibility-manager
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      # Persistent data (named volume — container controls ownership)
      - data:/data
      # Configuration (read-only bind mounts)
      - ./.secrets:/app/.secrets:ro,z
      - ./tools.ini:/app/tools.ini:ro,z
    environment:
      - NICEGUI_BROWSER_ONLY=1
      - ACCESSMAN_DB_PATH=/data/accessibility_manager.db
      - ACCESSMAN_BACKUP_DIR=/data/backups
      - ACCESSMAN_LOG_LEVEL=INFO
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp

volumes:
  data:
